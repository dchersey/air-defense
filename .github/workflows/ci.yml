name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (Elixir)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          elixir-version: "1.19"
      - run: mix deps.get
      - run: mix compile --warnings-as-errors
      - run: mix test

  app:
    name: Menu-bar app (Swift)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - run: swift --version
      - working-directory: macos/ControlPanel
        run: swift build -c release
